# 把 ahub 放在 Nginx 后面的示例配置：HTTPS、真实 IP、按 IP 限流。
# 说明和调整办法见 docs/deployment.md「放在反向代理后面」。
#
# 使用前要改：
#   1. example.com 和两个证书路径
#   2. proxy_pass 的地址（Nginx 在容器里时写 ahub 的容器名，例如 http://ahub:7788）
#   3. 在 Hub 上设置 AHUB_TRUST_PROXY 为 Nginx 的地址；Nginx 和 Hub 在同一台机器上时是 127.0.0.1，
#      在 Docker 网络里时写这个网络的网段
#
# 这个文件要放在 http 块里（比如 conf.d/），limit_*_zone 和 map 只能写在这一层。

# 只有登录接口才有 key，其他请求的 key 是空的，不计入这个限制
map $uri $ahub_auth_key {
    ~^/api/v1/(sessions|join|admin/login)$ $binary_remote_addr;
    default "";
}

# 只限制上传，下载（/files/<id>）不算
map "$request_method:$uri" $ahub_upload_key {
    "POST:/api/v1/files" $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr zone=ahub_general:5m rate=10r/s;
limit_req_zone $ahub_auth_key zone=ahub_auth:5m rate=30r/m;
limit_req_zone $ahub_upload_key zone=ahub_upload:5m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ahub_conn:5m;
limit_conn_zone $ahub_upload_key zone=ahub_upload_conn:5m;

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hub 的上传上限是 25 MB
    client_max_body_size 26m;

    # 每个 IP：所有请求 10 次/秒，可以突发 50 次
    limit_req zone=ahub_general burst=50 nodelay;
    # 登录接口和上传：各 30 次/分钟，可以突发 10 次
    limit_req zone=ahub_auth burst=10 nodelay;
    limit_req zone=ahub_upload burst=10 nodelay;
    # 同时连接 40 个，同时上传 6 个。HTTP/2 下每个请求都算一个连接
    limit_conn ahub_conn 40;
    limit_conn ahub_upload_conn 6;
    limit_req_status 429;
    limit_conn_status 429;

    # 返回 JSON：控制台按 JSON 解析错误，HTML 错误页会让它报另一个错
    error_page 429 @ahub_limited;
    location @ahub_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests, try again later"}}';
    }

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 事件流和长轮询：不缓冲，超时要够长
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
